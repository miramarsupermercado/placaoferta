<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Suporte - Lojas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-center items-center">

    <!-- Tela de Seleção de Loja (1 a 10) -->
    <div id="store-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full text-center max-h-[90vh] flex flex-col">
            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-store"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800 mb-1">Identificação da Loja</h2>
            <p class="text-slate-600 mb-4 text-xs">Selecione a sua unidade para iniciar o atendimento:</p>
            
            <!-- Lista com scroll para as 10 lojas -->
            <div id="stores-list-container" class="space-y-2 mb-2 overflow-y-auto pr-1 flex-1">
                <!-- Gerado via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Container Principal do Chat -->
    <div class="w-full max-w-2xl bg-white h-full md:h-[85vh] md:rounded-2xl shadow-xl flex flex-col overflow-hidden">
        
        <!-- Cabeçalho do Chat (Sem o botão de trocar loja) -->
        <div class="bg-[rgb(57_72_106)] text-white p-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-headset"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Suporte</h1>
                    <p id="current-store-display" class="text-xs text-blue-100">Nenhuma loja selecionada</p>
                </div>
            </div>
        </div>

        <!-- Corpo de Mensagens -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50"></div>

        <!-- Pré-visualização de imagem anexada -->
        <div id="image-preview-container" class="hidden px-4 pt-2 bg-white border-t border-slate-200 flex items-center space-x-3">
            <img id="image-preview" class="w-16 h-16 object-cover rounded-lg border border-slate-300">
            <div class="flex-1 text-xs text-slate-600 font-medium">Imagem pronta para envio</div>
            <button onclick="cancelImage()" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <!-- Caixa de Entrada de Mensagem -->
        <form id="chat-form" onsubmit="sendMessage(event)" class="bg-white p-3 border-t border-slate-200 flex items-center space-x-2">
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            <div id="message-controls" class="flex items-center space-x-2 flex-1">
                <button id="attach-button" type="button" onclick="document.getElementById('file-input').click()" class="text-slate-500 hover:text-blue-600 p-2.5 rounded-xl transition">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                </button>
                <input type="text" id="message-input" placeholder="Digite sua mensagem ou cole um print (Ctrl+V)..." autocomplete="off"
                    class="flex-1 min-w-0 bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition">
                <button id="send-button" type="submit" class="bg-[rgb(57_72_106)] hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-medium transition flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
                <button id="new-chat-button" type="button" onclick="startNewConversation()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-3 rounded-xl font-semibold transition justify-center items-center gap-2">
                    <i class="fa-solid fa-comments"></i> Iniciar nova conversa
                </button>
            </div>
        </form>
    </div>

    <!-- Firebase SDKs (Compat v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9cGs-ePVNJRd8uFbCF5CjQug1LImk6Dc",
            authDomain: "chat-1b4c4.firebaseapp.com",
            databaseURL: "https://chat-1b4c4-default-rtdb.firebaseio.com",
            projectId: "chat-1b4c4",
            storageBucket: "chat-1b4c4.firebasestorage.app",
            messagingSenderId: "357782257517",
            appId: "1:357782257517:web:739878b2a7b0cff2836464",
            measurementId: "G-RB680YGL8E"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const paramsChat = new URLSearchParams(window.location.search);
        const lojaInformadaNaUrl = paramsChat.get('loja') || '';
        let selectedStore = lojaInformadaNaUrl || localStorage.getItem('chat_store') || '';
        let base64ImageToSend = null;
        let conversationActive = true;
        let messagesListener = null;
        let statusListener = null;

        window.onload = function() {
            const container = document.getElementById('stores-list-container');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const storeName = `Loja ${i}`;
                container.innerHTML += `
                    <button onclick="selectStore('${storeName}')" class="w-full py-2.5 px-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-500 rounded-xl font-medium text-slate-700 hover:text-blue-600 transition flex items-center justify-between text-sm">
                        <span>${storeName}</span><i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                    </button>`;
            }
            if (selectedStore && /^Loja\s([1-9]|10)$/.test(selectedStore)) {
                localStorage.setItem('chat_store', selectedStore);
                document.getElementById('store-modal').style.display = 'none';
                document.getElementById('current-store-display').innerText = `Conectado como: ${selectedStore}`;
                listenMessages();
                listenConversationStatus();
            } else {
                document.getElementById('store-modal').style.display = 'flex';
            }
        };

        function selectStore(store) {
            if (messagesListener) db.ref('messages').off('value', messagesListener);
            if (statusListener) db.ref('chatStatus/' + selectedStore).off('value', statusListener);
            selectedStore = store;
            localStorage.setItem('chat_store', store);
            document.getElementById('store-modal').style.display = 'none';
            document.getElementById('current-store-display').innerText = `Conectado como: ${selectedStore}`;
            document.getElementById('chat-messages').innerHTML = '';
            listenMessages();
            listenConversationStatus();
        }

        function listenConversationStatus() {
            const statusRef = db.ref('chatStatus/' + selectedStore);
            statusListener = statusRef.on('value', snapshot => {
                // Compatibilidade: lojas antigas sem status começam ativas.
                conversationActive = snapshot.exists() ? snapshot.val().active !== false : true;
                updateComposerState();
            });
        }

        function updateComposerState() {
            const input = document.getElementById('message-input');
            const attach = document.getElementById('attach-button');
            const send = document.getElementById('send-button');
            const newChat = document.getElementById('new-chat-button');
            const fileInput = document.getElementById('file-input');
            const preview = document.getElementById('image-preview-container');

            input.classList.toggle('hidden', !conversationActive);
            attach.classList.toggle('hidden', !conversationActive);
            send.classList.toggle('hidden', !conversationActive);
            newChat.classList.toggle('hidden', conversationActive);
            newChat.classList.toggle('flex', !conversationActive);
            fileInput.disabled = !conversationActive;
            input.disabled = !conversationActive;
            if (!conversationActive) {
                cancelImage();
                document.getElementById('chat-messages').insertAdjacentHTML('beforeend', '');
            }
        }

        document.getElementById('message-input').addEventListener('paste', function(event) {
            if (!conversationActive) return;
            const clipboard = event.clipboardData || (event.originalEvent && event.originalEvent.clipboardData);
            if (!clipboard) return;
            const items = clipboard.items;
            for (let index = 0; index < items.length; index++) {
                const item = items[index];
                if (item.kind === 'file' && item.type.includes('image')) {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        if (!conversationActive) return;
                        base64ImageToSend = e.target.result;
                        document.getElementById('image-preview').src = base64ImageToSend;
                        document.getElementById('image-preview-container').classList.remove('hidden');
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        function handleFileSelect(event) {
            if (!conversationActive) return;
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                if (!conversationActive) return;
                base64ImageToSend = e.target.result;
                document.getElementById('image-preview').src = base64ImageToSend;
                document.getElementById('image-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function cancelImage() {
            base64ImageToSend = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('file-input').value = '';
        }

        async function startNewConversation() {
            if (!selectedStore || conversationActive) return;
            const button = document.getElementById('new-chat-button');
            button.disabled = true;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Iniciando...';
            try {
                // Apaga somente as mensagens da loja selecionada.
                const query = db.ref('messages').orderByChild('store').equalTo(selectedStore);
                const snapshot = await query.once('value');
                const deletions = {};
                snapshot.forEach(child => { deletions[child.key] = null; });
                if (Object.keys(deletions).length) {
                    await db.ref('messages').update(deletions);
                }
                await db.ref('chatStatus/' + selectedStore).set({
                    active: true,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });
                document.getElementById('chat-messages').innerHTML = '';
            } catch (error) {
                console.error('Erro ao iniciar nova conversa:', error);
                alert('Não foi possível iniciar uma nova conversa. Verifique a conexão e as regras do Firebase.');
            } finally {
                button.disabled = false;
                button.innerHTML = '<i class="fa-solid fa-comments"></i> Iniciar nova conversa';
            }
        }

        async function sendMessage(event) {
            event.preventDefault();
            if (!conversationActive) return;
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if ((!text && !base64ImageToSend) || !selectedStore) return;

            const messageData = {
                store: selectedStore,
                sender: 'user',
                text: text,
                image: base64ImageToSend || null,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                sentAt: firebase.database.ServerValue.TIMESTAMP
            };
            try {
                const messageRef = await db.ref('messages').push(messageData);
                input.value = '';
                cancelImage();
            } catch (error) {
                console.error('Erro ao enviar mensagem:', error);
                alert('Erro ao enviar mensagem.');
            }
        }

        // Confirma que mensagens da administração chegaram ao navegador da loja.
        // A confirmação de visualização só é gravada quando a página está visível.
        async function confirmAdminMessageStatus(messageId, msg) {
            if (!msg || msg.sender !== 'admin') return;
            const updates = {};
            if (!msg.deliveredAt) updates.deliveredAt = firebase.database.ServerValue.TIMESTAMP;
            if (document.visibilityState === 'visible' && !msg.readAt) {
                updates.readAt = firebase.database.ServerValue.TIMESTAMP;
            }
            if (Object.keys(updates).length) {
                try {
                    await db.ref('messages/' + messageId).update(updates);
                } catch (error) {
                    console.error('Não foi possível confirmar recebimento/visualização:', error);
                }
            }
        }

        function readReceiptIcon(status) {
            // O SVG azul abaixo é exatamente o desenho enviado pelo usuário.
            const doubleCheck = '<svg viewBox="0 0 24 24" width="16" height="16" preserveAspectRatio="xMidYMid meet" fill="currentColor" aria-label="' + status + '"><path fill="currentColor" d="M14.73 6.01a1 1 0 0 1 1.41-.15l.01.01a1 1 0 0 1 .15 1.41L7.6 18.01a1 1 0 0 1-.73.37h-.05c-.26 0-.52-.11-.71-.3l-4.03-4.09a.99.99 0 0 1 0-1.41.99.99 0 0 1 1.41 0l3.25 3.29 7.99-9.86Zm5.71.12a1 1 0 0 1 1.41-.15h-.01a1 1 0 0 1 .15 1.41l-8.41 10.45a1 1 0 0 1-.73.37h-.05a1 1 0 0 1-.71-.3l-1.36-1.26a.55.55 0 0 1-.02-.81l.56-.68c.21-.2.53-.21.75-.03l.71.58 7.71-9.58Z"></path></svg>';
            if (status === 'read') return '<span class="inline-flex items-center text-[#53bdeb]" title="Visualizada pelo administrador">' + doubleCheck + '</span>';
            if (status === 'delivered') return '<span class="inline-flex items-center text-slate-300" title="Recebida">' + doubleCheck + '</span>';
            return '<span class="inline-flex items-center text-slate-300" title="Enviada"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M9.2 16.2 4.9 12a1 1 0 0 0-1.4 1.4l5 5a1 1 0 0 0 1.4 0L21 7.3a1 1 0 1 0-1.4-1.4z"/></svg></span>';
        }

        function listenMessages() {
            const messagesContainer = document.getElementById('chat-messages');
            const query = db.ref('messages').orderByChild('store').equalTo(selectedStore);
            messagesListener = query.on('value', snapshot => {
                messagesContainer.innerHTML = '';
                if (!snapshot.exists()) {
                    messagesContainer.innerHTML = `
                        <div class="text-center text-slate-400 my-auto py-10">
                            <i class="fa-regular fa-comments text-3xl mb-2"></i>
                            <p class="text-sm">${conversationActive ? 'Nenhuma mensagem ainda. Inicie a conversa!' : 'Atendimento encerrado pelo suporte.'}</p>
                        </div>`;
                    return;
                }
                snapshot.forEach(childSnapshot => {
                    const messageId = childSnapshot.key;
                    const msg = childSnapshot.val() || {};
                    const isUser = msg.sender === 'user';
                    if (!isUser) confirmAdminMessageStatus(messageId, msg);

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;
                    const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                    const bubble = document.createElement('div');
                    bubble.className = `max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-sm ${isUser ? 'bg-[rgb(57_72_106)] text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'}`;

                    const sender = document.createElement('div');
                    sender.className = 'text-[10px] font-semibold mb-1 opacity-80';
                    sender.textContent = isUser ? selectedStore : 'Administração';
                    bubble.appendChild(sender);

                    if (msg.image) {
                        const img = document.createElement('img');
                        img.src = msg.image;
                        img.alt = 'Imagem enviada';
                        img.className = 'max-w-xs rounded-lg mb-2 cursor-pointer hover:opacity-90 transition';
                        img.onclick = () => window.open(img.src, '_blank');
                        bubble.appendChild(img);
                    }
                    if (msg.text) {
                        const paragraph = document.createElement('p');
                        paragraph.className = 'break-words whitespace-pre-wrap';
                        paragraph.textContent = msg.text;
                        bubble.appendChild(paragraph);
                    }

                    const footer = document.createElement('div');
                    footer.className = 'flex items-center justify-end gap-1 text-[9px] mt-1 opacity-80';
                    const timeSpan = document.createElement('span');
                    timeSpan.textContent = time;
                    footer.appendChild(timeSpan);
                    if (isUser) {
                        const status = msg.readAt ? 'read' : (msg.deliveredAt ? 'delivered' : 'sent');
                        const iconHolder = document.createElement('span');
                        iconHolder.innerHTML = readReceiptIcon(status);
                        footer.appendChild(iconHolder);
                    }
                    bubble.appendChild(footer);
                    msgDiv.appendChild(bubble);
                    messagesContainer.appendChild(msgDiv);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState !== 'visible' || !selectedStore) return;
            db.ref('messages').orderByChild('store').equalTo(selectedStore).once('value')
                .then(snapshot => snapshot.forEach(child => {
                    const msg = child.val() || {};
                    if (msg.sender === 'admin' && !msg.readAt) confirmAdminMessageStatus(child.key, msg);
                }))
                .catch(error => console.error('Erro ao confirmar visualizações:', error));
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
